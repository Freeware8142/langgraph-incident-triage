# Cloud Build Trigger Configuration
# Creates triggers for CI/CD pipeline

# Trigger 1: Main branch (production-ready builds)
- id: 'incident-triage-main-trigger'
  description: 'Build and deploy on main branch push'
  github:
    owner: 'Freeware8142'
    repo: 'langgraph-incident-triage'
    branch: '^main$'
  filename: 'cloudbuild/cloudbuild.yaml'
  includedFiles:
    - '**/*.py'
    - 'requirements.txt'
    - 'Dockerfile'
  ignoredFiles:
    - 'docs/**'
    - '*.md'
  substitutions:
    _REGION: us-central1
    _SERVICE_NAME: incident-triage
  tags:
    - 'incident-triage'
    - 'ci-cd'
    - 'main'

# Trigger 2: Pull request builds (quick validation)
- id: 'incident-triage-pr-trigger'
  description: 'Build on pull requests for validation'
  github:
    owner: 'Freeware8142'
    repo: 'langgraph-incident-triage'
    pullRequest:
      branch: '^main$'
  filename: 'cloudbuild/cloudbuild-pr.yaml'
  includedFiles:
    - '**/*.py'
    - 'requirements.txt'
  substitutions:
    _REGION: us-central1
    _SERVICE_NAME: incident-triage
  tags:
    - 'incident-triage'
    - 'pull-request'
