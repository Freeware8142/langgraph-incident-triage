# Cloud Build CI/CD Pipeline
# Builds and deploys the LangGraph Incident Triage System to Cloud Run
# Compatible with incident-triage-dev-trigger

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: incident-triage
  _REPOSITORY: us-central1/incident-triage-repo
  _DOCKER_IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/incident-triage-repo/incident-triage

steps:
  # Step 1: Configure Docker for Artifact Registry
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'configure-docker'
    entrypoint: 'gcloud'
    args:
      - 'auth'
      - 'configure-docker'
      - '${_REGION}-docker.pkg.dev'

  # Step 2: Build Docker image
  - name: 'docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - '${_DOCKER_IMAGE}:${SHORT_SHA}'
      - '-t'
      - '${_DOCKER_IMAGE}:latest'
      - '.'
    waitFor: ['configure-docker']

  # Step 3: Push Docker image to Artifact Registry
  - name: 'docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '${_DOCKER_IMAGE}'
    waitFor: ['build']

  # Step 4: Deploy to Cloud Run (dev environment with auto-scaling 0-10)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_DOCKER_IMAGE}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--concurrency=80'
      - '--timeout=60s'
      - '--set-env-vars=ENVIRONMENT=development'
    waitFor: ['push']

# Store images in Artifact Registry
images:
  - '${_DOCKER_IMAGE}:${SHORT_SHA}'
  - '${_DOCKER_IMAGE}:latest'

# Build timeout
timeout: '1200s'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  dynamicSubstitutions: true

# Environment variables from Secret Manager (set via gcloud run deploy --set-secrets)
# The following secrets must exist in Secret Manager:
# - MS_GRAPH_CLIENT_ID:latest
# - MS_GRAPH_CLIENT_SECRET:latest
# - TINES_API_KEY:latest
# - LANGSMITH_API_KEY:latest
