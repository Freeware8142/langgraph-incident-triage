# Cloud Deploy Delivery Pipeline
# Defines the CI/CD pipeline for dev/staging/prod environments

apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: incident-triage-pipeline
  labels:
    app: incident-triage
    team: platform
description: "Incident Triage System Deployment Pipeline"

serialPipeline:
  stages:
    - targetId: incident-triage-dev
      profiles: [dev]
      strategy:
        standard:
          deployParameters:
            - matches: cleanup
              values:
                serviceAccount: incident-triage-dev@PROJECT_ID.iam.gserviceaccount.com
                vpcconnector: incident-triage-vpc-connector
                cloudsqlinstance: ""
                setSecrets:
                  - MS_GRAPH_CLIENT_ID: projects/PROJECT_ID/secrets/MS_GRAPH_CLIENT_ID/latest
                  - MS_GRAPH_CLIENT_SECRET: projects/PROJECT_ID/secrets/MS_GRAPH_CLIENT_SECRET/latest
                  - TINES_API_KEY: projects/PROJECT_ID/secrets/TINES_API_KEY/latest
                  - LANGSMITH_API_KEY: projects/PROJECT_ID/secrets/LANGSMITH_API_KEY/latest

    - targetId: incident-triage-staging
      profiles: [staging]
      strategy:
        standard:
          deployParameters:
            - matches: cleanup
              values:
                serviceAccount: incident-triage-staging@PROJECT_ID.iam.gserviceaccount.com
                vpcconnector: incident-triage-vpc-connector
                cloudsqlinstance: ""
                setSecrets:
                  - MS_GRAPH_CLIENT_ID: projects/PROJECT_ID/secrets/MS_GRAPH_CLIENT_ID/latest
                  - MS_GRAPH_CLIENT_SECRET: projects/PROJECT_ID/secrets/MS_GRAPH_CLIENT_SECRET/latest
                  - TINES_API_KEY: projects/PROJECT_ID/secrets/TINES_API_KEY/latest
                  - LANGSMITH_API_KEY: projects/PROJECT_ID/secrets/LANGSMITH_API_KEY/latest

    - targetId: incident-triage
      profiles: [prod]
      strategy:
        standard:
          deployParameters:
            - matches: cleanup
              values:
                serviceAccount: incident-triage-prod@PROJECT_ID.iam.gserviceaccount.com
                vpcconnector: incident-triage-vpc-connector
                cloudsqlinstance: ""
                setSecrets:
                  - MS_GRAPH_CLIENT_ID: projects/PROJECT_ID/secrets/MS_GRAPH_CLIENT_ID/latest
                  - MS_GRAPH_CLIENT_SECRET: projects/PROJECT_ID/secrets/MS_GRAPH_CLIENT_SECRET/latest
                  - TINES_API_KEY: projects/PROJECT_ID/secrets/TINES_API_KEY/latest
                  - LANGSMITH_API_KEY: projects/PROJECT_ID/secrets/LANGSMITH_API_KEY/latest
